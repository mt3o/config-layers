name: Release

on:
  push:
    tags:
      - 'v*'

# Tightened from workflow-wide write access: only the job that creates the GitHub Release needs
# `contents: write`, and only the publish job needs `id-token: write` for npm provenance.
permissions:
  contents: read

jobs:
  build:
    name: Verify, build and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Derive the version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a semver version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      # `--ignore-scripts`, and no `cache: pnpm` or `--frozen-lockfile`.
      #
      # This repository deliberately commits neither `pnpm-lock.yaml` nor `pnpm-workspace.yaml`
      # (see .gitignore) - the first two options require the lockfile, and the build approval that
      # lets esbuild run its install script lives in the workspace file, so without it pnpm fails
      # with ERR_PNPM_IGNORED_BUILDS. Skipping dependency install scripts avoids needing that
      # approval at all, and is the safer default for CI regardless; esbuild's binary comes from
      # its platform package, so the build still works. Our own `prepare` is skipped too, which is
      # why every job below runs `pnpm build` explicitly.
      - run: pnpm install --ignore-scripts

      # The published version now comes from the tag. It used to be `npm version patch`, which
      # bumped from whatever was committed - so pushing v0.3.0 against a committed 0.2.1 published
      # 0.2.2, and the tag and the artifact disagreed.
      - name: Set the package version to the tag
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Report a version the repository has not committed
        run: |
          # `if` is used deliberately: GitHub runs steps under `bash -e`, and a bare
          # `git diff --quiet` returning 1 would fail the step rather than branch.
          if git --no-pager diff --quiet -- package.json; then
            echo "package.json already carried ${GITHUB_REF_NAME}."
          else
            echo "::warning::package.json was at a different version than tag ${GITHUB_REF_NAME}. The release uses the tag; consider bumping package.json in a commit before tagging."
          fi

      - run: pnpm lint
      - run: pnpm typecheck

      # Build after setting the version, so the bundle's license banner carries the released one,
      # and before testing, so the dist smoke tests actually run instead of skipping.
      - run: pnpm build
      - run: pnpm test

      - run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ./artifact

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifact/*.tgz

  publish:
    name: Stage for npm publish
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      # Checked out so npm can associate the provenance attestation with the source commit.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # `npm stage` needs npm >= 11.15.0 (and Node >= 22.14.0, which node-version 22 satisfies).
      # Node 22 ships a 10.x npm, so it has to be upgraded explicitly.
      - name: Install an npm that supports staging
        run: |
          npm install -g npm@^11.15.0
          npm --version

      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ./artifact

      # Kept from the original workflow: a fork that marks the package private should skip
      # publishing rather than fail on it.
      - name: Check whether the package is publishable
        id: publishable
        run: |
          PRIVATE=$(node -e "console.log(require('./package.json').private ? 'true' : 'false')")
          echo "private=$PRIVATE" >> "$GITHUB_OUTPUT"

      # Staged publishing rather than `npm publish`, because a plain publish cannot complete from
      # CI: npm demands proof-of-presence, and an unattended runner has no authenticator, so it
      # fails with EOTP however the token is scoped. `npm stage publish` defers that 2FA check -
      # the tarball is uploaded but withheld from the registry until a maintainer approves it,
      # which doubles as a review gate.
      #
      # No install step: staging a prebuilt tarball needs no dependencies, and skipping it avoids
      # running `prepare`, which would rebuild dist/ at the committed version.
      #
      # The `./` is load-bearing. Without it npm reads `artifact/config-layers-0.4.0.tgz` as a
      # GitHub `owner/repo` shorthand and tries to git-clone it, failing with exit 128.
      - name: Stage the release on npm
        if: ${{ env.NPM_TOKEN != '' && steps.publishable.outputs.private == 'false' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --provenance --access public ./artifact/*.tgz

      - name: Explain how to approve
        if: ${{ env.NPM_TOKEN != '' && steps.publishable.outputs.private == 'false' }}
        run: |
          {
            echo "### Staged, awaiting approval"
            echo
            echo "\`${GITHUB_REF_NAME}\` is uploaded to npm but **not yet installable**."
            echo "Approval requires 2FA, so it cannot be automated - a maintainer has to run:"
            echo
            echo '```'
            echo "npm stage list config-layers"
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "or approve it from the package page on npmjs.com."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip staging
        if: ${{ env.NPM_TOKEN == '' || steps.publishable.outputs.private == 'true' }}
        run: echo "::notice::Skipped npm staging - the package is private or NPM_TOKEN is not set."
