name: CI

# Nothing ran on a pull request before this, so the only signal was a tag push - by which point a
# regression is already being released.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm has to be on PATH before setup-node, or `cache: pnpm` has nothing to look for.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile so a drifted lockfile fails here rather than silently resolving to
      # something the repo never committed.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build before testing. The suite runs fine without dist/ - tests/dist-smoke.test.ts skips
      # itself when it is absent - but those are the checks that guard the published artifact and
      # the iPhone 6s syntax floor, so CI must not be the place they quietly skip.
      - run: pnpm build

      - run: pnpm test:coverage

      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
