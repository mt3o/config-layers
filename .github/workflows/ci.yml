name: CI

# Nothing ran on a pull request before this, so the only signal was a tag push - by which point a
# regression is already being released.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `cache: pnpm` and no `--frozen-lockfile`: this repository deliberately does not commit a
      # lockfile (see the note at the top of .gitignore - it has no runtime dependencies, so a
      # lockfile would only pin the dev toolchain). Both of those options require one, and
      # setup-node fails outright with "Dependencies lock file is not found" when it is missing.
      - run: pnpm install

      - run: pnpm lint
      - run: pnpm typecheck

      # Coverage is computed once here rather than per Node version - the numbers are identical
      # and instrumentation is not free. The build is needed so tests/dist-smoke.test.ts runs.
      - run: pnpm build
      - run: pnpm test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No `cache: pnpm` and no `--frozen-lockfile`: this repository deliberately does not commit a
      # lockfile (see the note at the top of .gitignore - it has no runtime dependencies, so a
      # lockfile would only pin the dev toolchain). Both of those options require one, and
      # setup-node fails outright with "Dependencies lock file is not found" when it is missing.
      - run: pnpm install

      # Build before testing. The suite runs fine without dist/ - tests/dist-smoke.test.ts skips
      # itself when it is absent - but those are the checks that guard the published artifact and
      # the iPhone 6s syntax floor, so CI must not be the place they quietly skip.
      - run: pnpm build

      # `pnpm test`, not `test:coverage`: the performance guards are excluded from a coverage run
      # because instrumentation distorts the very timings they assert on, so this is the run that
      # actually exercises them - on every supported Node version.
      - run: pnpm test
